<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🛡️ Admin - Caronas Fácil</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-light: #eef2ff;
      --accent: #dc2626;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
    }

    [data-theme="dark"] {
      --primary: #818cf8;
      --primary-dark: #c7d2fe;
      --primary-light: #1e1b4b;
      --accent: #f87171;
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --shadow: 0 1px 4px rgba(0,0,0,.4);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #818cf8;
        --primary-dark: #c7d2fe;
        --primary-light: #1e1b4b;
        --accent: #f87171;
        --bg: #0f172a;
        --surface: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #334155;
        --shadow: 0 1px 4px rgba(0,0,0,.4);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .login-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--text);
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background: var(--surface);
      font-family: inherit;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .error-box {
      background: #fff1f1;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: #b91c1c;
      margin-bottom: 16px;
      display: none;
      line-height: 1.5;
    }

    .error-box.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: filter 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      filter: brightness(0.93);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text);
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
    }

    .login-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 16px;
      font-family: monospace;
      color: var(--muted);
      transition: all 0.15s;
    }

    .theme-toggle:hover {
      background: var(--border);
    }

    .info-box {
      background: var(--primary-light);
      border: 1px solid #c7d2fe;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      color: var(--primary-dark);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .demo-credentials {
      font-family: monospace;
      background: var(--surface2);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div style="position: absolute; top: 20px; right: 20px; display: flex; gap: 8px;">
  <a href="/admin-dashboard" class="theme-toggle" style="text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 16px; font-family: monospace; color: var(--muted); transition: all 0.15s;" title="Ir para Dashboard">🛡️</a>
  <button class="theme-toggle" onclick="window.toggleAdminTheme()" title="Alternar tema">☀️🌙</button>
</div>

<div class="login-container">
  <div class="login-header">
    <div class="login-icon">🛡️</div>
    <div class="login-title">Acesso Administrativo</div>
    <div class="login-subtitle">Portal de Gerenciamento Caronas Fácil</div>
  </div>


  <div id="errorBox" class="error-box"></div>

  <form onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="username">Usuário</label>
      <input type="text" id="username" placeholder="Ex: Admin" required autocomplete="username"/>
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Sua senha" required autocomplete="current-password"/>
    </div>

    <button type="submit" class="btn btn-primary" id="loginBtn">
      <span id="btnText">Entrar como Admin</span>
      <span id="btnSpinner" style="display:none">
        <span class="spinner" style="width:16px;height:16px;border-width:2px;margin:0"></span>
      </span>
    </button>

    <button type="button" class="btn btn-secondary" onclick="goBackToEvent()">
      Voltar para Evento
    </button>
  </form>

  <div class="login-footer">
    <p>Para acessar eventos, <a href='/'>clique aqui</a></p>
  </div>
</div>

<script>
  // Dark mode
  (function() {
    const THEME_KEY = 'adminTheme';
    const root = document.documentElement;

    function applyTheme(theme) {
      if (theme === 'dark') root.setAttribute('data-theme', 'dark');
      else if (theme === 'light') root.setAttribute('data-theme', 'light');
      else root.removeAttribute('data-theme');
      if (theme) localStorage.setItem(THEME_KEY, theme);
      else localStorage.removeItem(THEME_KEY);
    }

    const saved = localStorage.getItem(THEME_KEY);
    applyTheme(saved || null);

    window.toggleAdminTheme = function() {
      const cur = root.getAttribute('data-theme');
      const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if (!cur) applyTheme(sys === 'dark' ? 'light' : 'dark');
      else if (cur === 'dark') applyTheme('light');
      else applyTheme('dark');
    };
  })();

  // Credenciais de admin (em produção, usar Firebase Auth)
  const ADMIN_USERNAME = 'Admin';
  const ADMIN_PASSWORD = 'Luiz@2026!';

  function showError(msg) {
    const el = document.getElementById('errorBox');
    el.textContent = msg;
    el.classList.add('show');
  }

  function hideError() {
    const el = document.getElementById('errorBox');
    el.classList.remove('show');
  }

  function setLoading(loading) {
    const btn = document.getElementById('loginBtn');
    const text = document.getElementById('btnText');
    const spinner = document.getElementById('btnSpinner');
    btn.disabled = loading;
    text.style.display = loading ? 'none' : 'inline';
    spinner.style.display = loading ? 'inline' : 'none';
  }

  async function handleLogin(e) {
    e.preventDefault();
    hideError();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!username || !password) {
      showError('Informe usuário e senha.');
      return;
    }

    setLoading(true);

    // Simular delay de rede
    await new Promise(r => setTimeout(r, 800));

    // Validar credenciais
    if (username !== ADMIN_USERNAME || password !== ADMIN_PASSWORD) {
      setLoading(false);
      showError('Usuário ou senha incorretos.');
      return;
    }

    // Login bem-sucedido
    const token = btoa(`${username}:${Date.now()}`); // Token simples (em prod usar JWT)
    localStorage.setItem('adminToken', token);
    localStorage.setItem('adminUser', username);
    localStorage.setItem('adminLoginTime', Date.now());

    // Redirecionar para dashboard
    window.location.href = './admin-dashboard.html';
  }

  function goBackToEvent() {
    const eventId = new URLSearchParams(window.location.search).get('eventId');
    if (eventId) {
      window.location.href = `./event.html?id=${eventId}`;
    } else {
      window.location.href = './index.html';
    }
  }

  // Verificar se já está logado
  function checkAdminSession() {
    const token = localStorage.getItem('adminToken');
    if (token) {
      window.location.href = './admin-dashboard.html';
    }
  }

  checkAdminSession();

  // Enter para enviar form
  document.getElementById('password').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.querySelector('form').dispatchEvent(new Event('submit'));
  });
</script>

</body>
</html>

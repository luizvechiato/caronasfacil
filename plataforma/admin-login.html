<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin · Caronas Fácil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #0c6e6b;
      --primary-dark: #08514f;
      --primary-light: #dbeceb;
      --primary-tint: #dbeceb;
      --accent: #c24a2c;
      --gold: #e0913a;
      --bg: #f6f4ef;
      --surface: #ffffff;
      --surface2: #efece4;
      --text: #16211f;
      --muted: #5b6763;
      --border: #e4dfd6;
      --border-2: #d7d0c4;
      --shadow: 0 1px 2px rgba(24,30,28,.06),0 6px 18px -10px rgba(24,30,28,.20);
      --shadow-lg: 0 12px 34px -14px rgba(14,43,42,.34);
      --header-bg: #0e2b2a;
      --sans:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      --serif:'Fraunces',Georgia,'Times New Roman',serif;
    }

    [data-theme="dark"] {
      --primary: #3fb0ab;
      --primary-dark: #8fd3ce;
      --primary-light: #123a38;
      --primary-tint: #123a38;
      --accent: #e07a5a;
      --gold: #e6a24f;
      --bg: #12100e;
      --surface: #1c1a16;
      --surface2: #26231e;
      --text: #f3efe7;
      --muted: #a49b8b;
      --border: #332f28;
      --border-2: #413c33;
      --shadow: 0 1px 3px rgba(0,0,0,.5);
      --shadow-lg: 0 12px 34px -14px rgba(0,0,0,.6);
      --header-bg: #0b1e1d;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #3fb0ab;
        --primary-dark: #8fd3ce;
        --primary-light: #123a38;
        --primary-tint: #123a38;
        --accent: #e07a5a;
        --gold: #e6a24f;
        --bg: #12100e;
        --surface: #1c1a16;
        --surface2: #26231e;
        --text: #f3efe7;
        --muted: #a49b8b;
        --border: #332f28;
        --border-2: #413c33;
        --shadow: 0 1px 3px rgba(0,0,0,.5);
        --shadow-lg: 0 12px 34px -14px rgba(0,0,0,.6);
        --header-bg: #0b1e1d;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .login-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--text);
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background: var(--surface);
      font-family: inherit;
      transition: border-color 0.15s;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .error-box {
      background: #fff1f1;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: #b91c1c;
      margin-bottom: 16px;
      display: none;
      line-height: 1.5;
    }

    .error-box.show {
      display: block;
    }

    .success-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: #15803d;
      margin-bottom: 16px;
      display: none;
      line-height: 1.5;
    }

    .success-box.show {
      display: block;
    }

    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: filter 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      filter: brightness(0.93);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text);
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      padding: 0;
    }

    .btn-link:hover {
      text-decoration: underline;
    }

    .forgot-row {
      text-align: right;
      margin: -12px 0 20px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
    }

    .login-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .theme-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 16px;
      font-family: monospace;
      color: var(--muted);
      transition: all 0.15s;
    }

    .theme-toggle:hover {
      background: var(--border);
    }

    /* ── CAMADA PREMIUM ── */
    body{font-family:var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.005em;}
    .ic{width:1em;height:1em;display:inline-block;vertical-align:-.125em;flex-shrink:0;}
    .login-container{border-radius:20px;box-shadow:var(--shadow-lg);border:1px solid var(--border);padding:36px 32px;}
    .login-icon{font-size:0;margin-bottom:16px;}
    .login-mk{width:58px;height:58px;border-radius:17px;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;}
    .login-mk .ic{width:29px;height:29px;}
    .login-title{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;}
    input[type="email"],input[type="password"]{border-radius:11px;border:1.5px solid var(--border-2);}
    input[type="email"]:focus,input[type="password"]:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
    .btn{border-radius:12px;font-weight:700;letter-spacing:-.01em;}
    .btn-primary{box-shadow:0 6px 16px -9px rgba(12,110,107,.7);}
    .btn-secondary{border-radius:12px;}
    .theme-toggle{border-radius:10px;}
    .theme-toggle .ic{width:17px;height:17px;}
  </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.6-3 8-7 10-4-2-7-5.4-7-10V6z"/><path d="M9 12l2 2 4-4"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></symbol>
</defs></svg>

<div style="position: absolute; top: 20px; right: 20px; display: flex; gap: 8px;">
  <button class="theme-toggle" onclick="window.toggleAdminTheme()" title="Alternar tema"><svg class="ic"><use href="#i-sun"/></svg></button>
</div>

<div class="login-container">
  <div class="login-header">
    <div class="login-icon"><span class="login-mk"><svg class="ic"><use href="#i-shield"/></svg></span></div>
    <div class="login-title">Acesso Administrativo</div>
    <div class="login-subtitle">Portal de Gerenciamento Caronas Fácil</div>
  </div>

  <div id="errorBox" class="error-box"></div>
  <div id="successBox" class="success-box"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" required autocomplete="username"/>
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Sua senha" required autocomplete="current-password"/>
    </div>

    <div class="forgot-row">
      <button type="button" class="btn-link" id="forgotBtn">Esqueci minha senha</button>
    </div>

    <button type="submit" class="btn btn-primary" id="loginBtn">
      <span id="btnText">Entrar como Admin</span>
      <span id="btnSpinner" style="display:none"><span class="spinner"></span></span>
    </button>

    <button type="button" class="btn btn-secondary" onclick="goBackToEvent()">
      Voltar para Evento
    </button>
  </form>

  <div class="login-footer">
    <p>Para acessar eventos, <a href='/'>clique aqui</a></p>
  </div>
</div>

<script type="module">
import { initializeApp }             from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail,
         onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey:            "AIzaSyBLiObW7HniFnJGcGt5xPFQNdtSXuZxQjw",
  authDomain:        "caronas-lhpv.firebaseapp.com",
  databaseURL:       "https://caronas-lhpv-default-rtdb.firebaseio.com",
  projectId:         "caronas-lhpv",
  storageBucket:     "caronas-lhpv.firebasestorage.app",
  messagingSenderId: "159548357201",
  appId:             "1:159548357201:web:91b8a892071daef103d670",
  measurementId:     "G-QNNJN6WTCW"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Lista de e-mails com acesso ao painel administrativo.
// Adicione outros e-mails aqui se precisar dar acesso a mais pessoas no futuro.
const ADMIN_EMAILS = ['lhvechiato@gmail.com'];

function isAdminEmail(email) {
  return !!email && ADMIN_EMAILS.includes(email.toLowerCase());
}

function showError(msg) {
  hideSuccess();
  const el = document.getElementById('errorBox');
  el.textContent = msg;
  el.classList.add('show');
}
function hideError() {
  document.getElementById('errorBox').classList.remove('show');
}
function showSuccess(msg) {
  hideError();
  const el = document.getElementById('successBox');
  el.textContent = msg;
  el.classList.add('show');
}
function hideSuccess() {
  document.getElementById('successBox').classList.remove('show');
}

function setLoading(loading) {
  const btn = document.getElementById('loginBtn');
  const text = document.getElementById('btnText');
  const spinner = document.getElementById('btnSpinner');
  btn.disabled = loading;
  text.style.display = loading ? 'none' : 'inline';
  spinner.style.display = loading ? 'inline-flex' : 'none';
}

function friendlyAuthError(code) {
  switch (code) {
    case 'auth/invalid-email':       return 'E-mail inválido.';
    case 'auth/user-not-found':
    case 'auth/invalid-credential':
    case 'auth/wrong-password':      return 'E-mail ou senha incorretos.';
    case 'auth/too-many-requests':   return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
    default:                         return 'Não foi possível entrar. Tente novamente.';
  }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  hideSuccess();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    showError('Informe e-mail e senha.');
    return;
  }

  setLoading(true);
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    if (!isAdminEmail(cred.user.email)) {
      await signOut(auth);
      setLoading(false);
      showError('Este acesso é restrito ao administrador do sistema.');
      return;
    }
    window.location.href = './admin-dashboard.html';
  } catch (err) {
    setLoading(false);
    showError(friendlyAuthError(err.code));
  }
});

document.getElementById('forgotBtn').addEventListener('click', async () => {
  hideError();
  hideSuccess();
  const email = document.getElementById('email').value.trim();
  if (!email) {
    showError('Digite seu e-mail no campo acima e clique de novo em "Esqueci minha senha".');
    return;
  }
  if (!isAdminEmail(email)) {
    showError('Este acesso é restrito ao administrador do sistema.');
    return;
  }
  try {
    await sendPasswordResetEmail(auth, email);
    showSuccess('Enviamos um e-mail com um link para redefinir sua senha.');
  } catch (err) {
    showError(friendlyAuthError(err.code));
  }
});

function goBackToEvent() {
  const eventId = new URLSearchParams(window.location.search).get('eventId');
  if (eventId) {
    window.location.href = `./event.html?id=${eventId}`;
  } else {
    window.location.href = './index.html';
  }
}
window.goBackToEvent = goBackToEvent;

// Se já estiver logado como admin, pula direto pro dashboard.
onAuthStateChanged(auth, (user) => {
  if (user && isAdminEmail(user.email)) {
    window.location.href = './admin-dashboard.html';
  }
});

// Enter no campo de senha envia o form
document.getElementById('password').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') document.getElementById('loginForm').requestSubmit();
});
</script>

<script>
  // Dark mode (fora do module para ficar disponível já no primeiro paint)
  (function() {
    const THEME_KEY = 'adminTheme';
    const root = document.documentElement;

    function applyTheme(theme) {
      if (theme === 'dark') root.setAttribute('data-theme', 'dark');
      else if (theme === 'light') root.setAttribute('data-theme', 'light');
      else root.removeAttribute('data-theme');
      if (theme) localStorage.setItem(THEME_KEY, theme);
      else localStorage.removeItem(THEME_KEY);
    }

    const saved = localStorage.getItem(THEME_KEY);
    applyTheme(saved || null);

    window.toggleAdminTheme = function() {
      const cur = root.getAttribute('data-theme');
      const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if (!cur) applyTheme(sys === 'dark' ? 'light' : 'dark');
      else if (cur === 'dark') applyTheme('light');
      else applyTheme('dark');
    };
  })();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔧 Migração de Eventos - Caronas Fácil</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }
    h1 { font-size: 24px; margin-bottom: 10px; }
    .subtitle { color: #666; margin-bottom: 20px; }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: monospace;
    }
    input:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #3730a3; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .status.success {
      display: block;
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #166534;
    }
    .status.error {
      display: block;
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #991b1b;
    }
    .status.info {
      display: block;
      background: #dbeafe;
      border: 1px solid #93c5fd;
      color: #1e40af;
    }
    code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🔧 Migração de Eventos</h1>
  <p class="subtitle">Adicionar email do criador aos eventos antigos</p>

  <div class="form-group">
    <label>Email do criador:</label>
    <input type="email" id="creatorEmail" placeholder="exemplo@email.com" value="pedromartins@example.com"/>
  </div>

  <div class="form-group">
    <label>Nome do criador:</label>
    <input type="text" id="creatorName" placeholder="Pedro Romeu" value="Pedro Romeu"/>
  </div>

  <button onclick="migrateEvents()" id="migrateBtn">
    🚀 Migrar eventos antigos
  </button>

  <div id="status" class="status"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBLiObW7HniFnJGcGt5xPFQNdtSXuZxQjw",
  authDomain: "caronas-lhpv.firebaseapp.com",
  databaseURL: "https://caronas-lhpv-default-rtdb.firebaseio.com",
  projectId: "caronas-lhpv",
  storageBucket: "caronas-lhpv.firebasestorage.app",
  messagingSenderId: "159548357201",
  appId: "1:159548357201:web:91b0a892071daef103d670"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

async function migrateEvents() {
  const email = document.getElementById('creatorEmail').value.trim();
  const name = document.getElementById('creatorName').value.trim();
  const btn = document.getElementById('migrateBtn');
  const status = document.getElementById('status');

  if (!email) {
    showStatus('Informe o email do criador', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Migrando...';

  try {
    const snapshot = await db.ref('events').once('value');
    const data = snapshot.val();

    if (!data) {
      showStatus('Nenhum evento encontrado na database', 'error');
      btn.disabled = false;
      btn.textContent = '🚀 Migrar eventos antigos';
      return;
    }

    let migrated = 0;
    let alreadyHave = 0;

    for (const eventId in data) {
      const event = data[eventId];

      // Se já tem email, pula
      if (event.creatorEmail) {
        alreadyHave++;
        continue;
      }

      // Adicionar email e nome
      await db.ref(`events/${eventId}/creatorEmail`).set(email);
      await db.ref(`events/${eventId}/creatorName`).set(name || 'Desconhecido');
      migrated++;
    }

    showStatus(
      `✅ Migração concluída!<br/>` +
      `📝 Eventos atualizados: ${migrated}<br/>` +
      `✓ Eventos que já tinham email: ${alreadyHave}`,
      'success'
    );
  } catch (error) {
    showStatus(`❌ Erro: ${error.message}`, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 Migrar eventos antigos';
  }
}

function showStatus(msg, type) {
  const status = document.getElementById('status');
  status.innerHTML = msg;
  status.className = `status ${type}`;
  status.scrollIntoView({ behavior: 'smooth' });
}
</script>

</body>
</html>
